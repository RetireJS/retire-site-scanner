name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    container:
      image: node:24-bookworm

    env:
      # Use the distro Chromium instead of downloading Puppeteer's bundled
      # Chrome, mirroring how the project's Dockerfile runs the scanner.
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium

    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          apt-get update
          apt-get install -y chromium
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run integrationTest
